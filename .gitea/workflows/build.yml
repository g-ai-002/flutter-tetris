name: 🧱 构建与发布

on:
  workflow_dispatch:

run-name: 🧱 构建 ${{ github.ref_name }}

concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: true

env:
  APP_NAME: ${{ github.event.repository.name }}

jobs:
  metadata:
    runs-on: ubuntu-latest
    name: 📋 准备包元数据
    outputs:
      app_version: ${{ steps.version.outputs.jversion }}
      project_name: ${{ steps.project.outputs.project_name }}
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v6

      - name: 🔢 解析包版本号
        id: version
        shell: bash
        run: |
          jversion=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            raw_tag="${{ github.ref_name }}"
            version=$(echo "$raw_tag" | sed -E 's/^[vV]//')
            jversion=$(echo "$version" | sed -E 's/^([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/')
            if [ -z "$jversion" ]; then
              jversion=$(grep '^version:' pubspec.yaml | awk '{print $2}')
            fi
          fi
          echo "jversion=$jversion" >> $GITHUB_OUTPUT
          echo "📌 使用的版本号: $jversion"

      - name: 🏷️ 计算项目名称
        id: project
        shell: bash
        run: |
          projectName=$(echo "${{ env.APP_NAME }}" | tr '-' '_')
          echo "project_name=$projectName" >> $GITHUB_OUTPUT
          echo "📌 Flutter 项目名: $projectName"

  test:
    needs: [ metadata ]
    runs-on: ubuntu-flutter
    name: 🧪 运行 Dart 测试
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v6

      - name: 📦 安装依赖
        run: flutter pub get

      - name: 🔍 静态分析
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: ✅ 运行测试
        run: flutter test --concurrency=2

  build-android:
    needs: [ metadata, test ]
    runs-on: ubuntu-flutter
    name: 🤖 构建 Android APK
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v6

      - name: 🩺 诊断网络与 Flutter 环境
        run: |
          echo "=== 🌍 构建环境变量 ==="
          echo "USE_MIRRORPROXY=${USE_MIRRORPROXY:-<未设置>}"
          echo "JAVA_HOME=${JAVA_HOME:-<未设置>}"
          echo "ANDROID_HOME=${ANDROID_HOME:-<未设置>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<未设置>}"
          echo "GRADLE_USER_HOME=${GRADLE_USER_HOME:-<未设置>}"
          echo "http_proxy=${http_proxy:-<未设置>}"
          echo "https_proxy=${https_proxy:-<未设置>}"
          echo "=== 🦋 Flutter 版本 ==="
          flutter --version
          echo "=== 🩺 Flutter doctor（输出写入 doctor.log，最多等 20s） ==="
          # 不能让 doctor 直接写步骤日志：一旦有子进程残留，它会一直占着日志管道，
          # 步骤就永远走不到下一步（曾因此在同一位置卡死 7 分钟）。
          # stdin 接 /dev/null，避免子命令等交互输入。
          timeout -k 5 20 flutter doctor -v > doctor.log 2>&1 </dev/null || true
          cat doctor.log 2>/dev/null || true
          # timeout 只覆盖 msys 进程组，残留的 dart 会占住 flutter 启动锁，后面 pub get/build 会死等
          if pgrep -f flutter_tools.snapshot > /dev/null 2>&1; then
            echo "⚠️ flutter doctor 仍有残留进程，强制清理"
            pkill -f flutter_tools.snapshot > /dev/null 2>&1 || true
          fi
          echo "=== 🌍 Flutter 相关环境变量 ==="
          echo "FLUTTER_STORAGE_BASE_URL=${FLUTTER_STORAGE_BASE_URL:-<未设置>}"
          echo "PUB_HOSTED_URL=${PUB_HOSTED_URL:-<未设置>}"

      - name: 📦 安装依赖
        run: flutter pub get

      - name: 🪞 部署 Maven 镜像代理脚本
        run: |
          mkdir -p ~/.gradle/init.d
          cp android/gradle/init-mirrorproxy.gradle ~/.gradle/init.d/init-mirrorproxy.gradle
          echo "✅ init 脚本已部署到 ~/.gradle/init.d/"
          if [ "${USE_MIRRORPROXY:-}" = "true" ]; then
            echo "🔧 USE_MIRRORPROXY=true，将全局启用内网 Maven 镜像代理"
          else
            echo "ℹ️ 未设置 USE_MIRRORPROXY，init 脚本将不生效"
          fi

      - name: 🔨 构建 Android APK
        run: flutter build apk --release --target-platform android-arm64

      - name: 📝 重命名 Android APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk ./${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-android-aarch64.apk

      - name: ⬆️ 上传 Android 产物
        uses: actions/gitea-upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-android-aarch64.apk
          path: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-android-aarch64.apk

  build-windows:
    needs: [ metadata, test ]
    runs-on: windows-flutter
    name: 🪟 构建 Windows EXE
    permissions:
      contents: read
    timeout-minutes: 30
    defaults:
      run:
        working-directory: C:\w
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v6

      - name: 📂 复制工程到短路径
        shell: bash
        working-directory: C:/
        run: |
          set -euo pipefail
          src=$(cygpath -u "$GITHUB_WORKSPACE")
          rm -rf /c/w
          mkdir -p /c/w
          cp -a "$src"/. /c/w/
          echo "✅ 工程已复制: $src -> C:\\w"

      - name: 🩺 诊断网络与 Flutter 环境
        shell: bash
        run: |
          echo "=== 🌍 构建环境变量 ==="
          echo "http_proxy=${http_proxy:-<未设置>}"
          echo "https_proxy=${https_proxy:-<未设置>}"
          echo "=== 🦋 Flutter 版本 ==="
          flutter --version
          echo "=== 🩺 Flutter doctor（输出写入 doctor.log，最多等 20s） ==="
          # Windows 上 flutter 是 bash → flutter.bat(cmd.exe) → dart.exe 的进程链，
          # timeout 只能覆盖 msys 侧的进程。doctor 的输出必须落文件，否则一旦 dart
          # 残留，它会一直占着步骤的 stdout 管道，步骤永远走不到下一步（曾卡死 7 分钟）。
          # stdin 接 /dev/null，避免子命令等交互输入。
          timeout -k 5 20 flutter doctor -v > doctor.log 2>&1 </dev/null || true
          cat doctor.log 2>/dev/null || true
          # 残留的 dart 会占住 flutter 启动锁，后面 pub get / build 会一直等锁
          if tasklist -FI 'IMAGENAME eq dart.exe' 2>/dev/null | grep -qi 'dart\.exe'; then
            echo "⚠️ 检测到残留的 dart 进程，强制清理"
            taskkill //F //T //IM dart.exe > /dev/null 2>&1 || true
          fi
          echo "=== 🌍 Flutter 相关环境变量 ==="
          echo "FLUTTER_STORAGE_BASE_URL=${FLUTTER_STORAGE_BASE_URL:-<未设置>}"
          echo "PUB_HOSTED_URL=${PUB_HOSTED_URL:-<未设置>}"

      - name: 📦 安装依赖
        shell: bash
        run: flutter pub get

      - name: 🏗️ 生成 Windows 平台文件
        shell: bash
        run: flutter create --platforms=windows --project-name ${{ needs.metadata.outputs.project_name }} .

      - name: 🩹 CMakeLists 启用 CMP0091 策略（VS 2026 要求）
        shell: bash
        run: |
          sed -i -E 's|^(cmake_minimum_required\(VERSION [0-9.]+\))$|\1\ncmake_policy(SET CMP0091 NEW)|' windows/CMakeLists.txt
          grep -n 'CMP0091' windows/CMakeLists.txt

      - name: 🔨 构建 Windows
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
        shell: bash
        run: flutter build windows --release

      - name: 📊 列出构建产物
        shell: bash
        run: |
          release_dir='build/windows/x64/runner/Release'
          if [ -d "$release_dir" ]; then
            total_bytes=0
            for f in "$release_dir"/*; do
              if [ -f "$f" ]; then
                size=$(stat -c%s "$f")
                size_mb=$(awk "BEGIN{printf \"%.2f\", $size/1048576}")
                echo "  📄 $(basename "$f")  ($size_mb MB)"
                total_bytes=$((total_bytes + size))
              fi
            done
            total_mb=$(awk "BEGIN{printf \"%.2f\", $total_bytes/1048576}")
            echo "  📊 合计: $total_mb MB"
          else
            echo "❌ 未找到构建输出目录"
            exit 1
          fi

      - name: 🗜️ 打包 Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath windows.zip -Force
          Write-Host "✅ ZIP 大小: $([math]::Round((Get-Item windows.zip).Length / 1MB, 2)) MB"

      - name: 📝 重命名 Windows ZIP
        shell: bash
        run: |
          mv -f windows.zip "./${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-windows-x86_64.zip"

      - name: ⬆️ 上传 Windows 产物
        uses: actions/gitea-upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-windows-x86_64.zip
          path: C:/w/${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-windows-x86_64.zip

  # ========== 🌐 构建 Flutter Web：tag 发正式版本，其余触发发 debug 预览 ==========
  build-web:
    needs: [ metadata, test ]
    runs-on: ubuntu-flutter
    name: 🌐 构建 Web 并发布 Pages
    permissions:
      contents: write  # ✅ 需要向 tea-pages 分支推送站点
    timeout-minutes: 30
    concurrency:
      group: pages-${{ github.event.repository.name }}
      cancel-in-progress: false  # ✅ 串行写 tea-pages，避免并发覆盖
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v6

      - name: 🩺 诊断网络与 Flutter 环境
        run: |
          echo "=== 🌍 构建环境变量 ==="
          echo "http_proxy=${http_proxy:-<未设置>}"
          echo "https_proxy=${https_proxy:-<未设置>}"
          echo "=== 🦋 Flutter 版本 ==="
          flutter --version
          echo "=== 🩺 Flutter doctor（输出写入 doctor.log，最多等 20s） ==="
          # 不能让 doctor 直接写步骤日志：一旦有子进程残留，它会一直占着日志管道，
          # 步骤就永远走不到下一步（曾因此在同一位置卡死 7 分钟）。
          # stdin 接 /dev/null，避免子命令等交互输入。
          timeout -k 5 20 flutter doctor -v > doctor.log 2>&1 </dev/null || true
          cat doctor.log 2>/dev/null || true
          # timeout 只覆盖 msys 进程组，残留的 dart 会占住 flutter 启动锁，后面 pub get/build 会死等
          if pgrep -f flutter_tools.snapshot > /dev/null 2>&1; then
            echo "⚠️ flutter doctor 仍有残留进程，强制清理"
            pkill -f flutter_tools.snapshot > /dev/null 2>&1 || true
          fi
          echo "=== 🌍 Flutter 相关环境变量 ==="
          echo "FLUTTER_STORAGE_BASE_URL=${FLUTTER_STORAGE_BASE_URL:-<未设置>}"
          echo "PUB_HOSTED_URL=${PUB_HOSTED_URL:-<未设置>}"

      - name: 📦 安装依赖
        run: flutter pub get

      - name: 🧭 计算发布路径
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "VERSION_PATH=v${{ needs.metadata.outputs.app_version }}" >> "$GITHUB_ENV"
            echo "IS_RELEASE=true" >> "$GITHUB_ENV"
            echo "📦 发布路径: v${{ needs.metadata.outputs.app_version }}"
          else
            echo "VERSION_PATH=debug" >> "$GITHUB_ENV"
            echo "IS_RELEASE=false" >> "$GITHUB_ENV"
            echo "🧪 预览路径: debug"
          fi

      - name: 🔑 准备站点推送地址
        shell: bash
        run: |
          set -euo pipefail
          push_url=$(printf '%s' "${{ github.server_url }}/${{ github.repository }}.git" \
            | sed -E 's#^(https?)://#\1://oauth2:${{ secrets.GITEA_TOKEN }}@#')
          echo "PUSH_URL=$push_url" >> "$GITHUB_ENV"
          echo "📌 站点推送地址: $(printf '%s' "$push_url" | sed -E 's#//[^@]*@#//***@#')"

      - name: 🌐 生成并汉化 Web 平台文件
        run: |
          set -euo pipefail
          flutter create --platforms=web --project-name ${{ needs.metadata.outputs.project_name }} .

          # SoLoud 的 Web 端必须先加载它自带的 WASM 加载器，否则 init() 报模块错误。
          sed -i 's|<body>|<body>\n  <script src="assets/packages/flutter_soloud/web/init_soloud.js" defer></script>|' web/index.html
          grep -n 'init_soloud.js' web/index.html

          app_desc=$(grep '^description:' pubspec.yaml | sed -E 's/^description:[[:space:]]*//')
          app_title=$(echo "$app_desc" | sed -E 's/[[:space:]]*-.*$//')
          echo "📌 站点标题: $app_title"
          echo "📌 站点描述: $app_desc"

          sed -i "s|<title>.*</title>|<title>${app_title}</title>|" web/index.html
          sed -i "s|<meta name=\"description\" content=\"[^\"]*\">|<meta name=\"description\" content=\"${app_desc}\">|" web/index.html
          sed -i "s|<meta name=\"apple-mobile-web-app-title\" content=\"[^\"]*\">|<meta name=\"apple-mobile-web-app-title\" content=\"${app_title}\">|" web/index.html
          sed -i "s|<meta name=\"theme-color\" content=\"[^\"]*\">|<meta name=\"theme-color\" content=\"#B03A2E\">|" web/index.html

          jq --arg name "$app_title" --arg desc "$app_desc" \
            '.name = $name | .short_name = $name | .description = $desc | .theme_color = "#B03A2E" | .background_color = "#F6EFE1"' \
            web/manifest.json > web/manifest.json.tmp
          mv web/manifest.json.tmp web/manifest.json

          echo "--- 📄 web/manifest.json ---"
          cat web/manifest.json

      - name: 🔨 构建 Web 产物
        run: |
          set -euo pipefail
          # 不传 --base-href，产物全部走相对路径
          flutter build web --release

          # Flutter 默认写入 <base href="/">，资源会按域名根路径请求，只能部署在站点根目录。
          # 删掉该标签后浏览器以页面自身地址为基准解析，产物放到服务器任意目录都能跑。
          sed -i -E 's|<base[[:space:]]+href="[^"]*"[[:space:]]*/?>||g' build/web/index.html
          sed -i -E '/^[[:space:]]*$/d' build/web/index.html
          if grep -qi '<base[[:space:]]' build/web/index.html; then
            echo "❌ base 标签清理失败"
            exit 1
          fi
          grep -n 'flutter_bootstrap.js' build/web/index.html
          du -sh build/web

      - name: 🗜️ 打包 Web 产物
        run: |
          set -euo pipefail
          zip_name="${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-web.zip"
          rm -f "$zip_name"
          ( cd build/web && zip -qr "$GITHUB_WORKSPACE/$zip_name" . )
          du -sh "$zip_name"
          unzip -l "$zip_name" | tail -5

      - name: ⬆️ 上传 Web 产物
        uses: actions/gitea-upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-web.zip
          path: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-web.zip

      - name: 📚 检出 tea-pages 站点分支
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@noreply.localhost"

          if ! git ls-remote --exit-code --heads "$PUSH_URL" tea-pages > /dev/null 2>&1; then
            echo "ℹ️ tea-pages 分支不存在，用空孤儿提交初始化"
            empty_tree=$(git mktree < /dev/null)
            init_commit=$(git commit-tree "$empty_tree" -m "🌐 初始化 Gitea Pages")
            git push "$PUSH_URL" "$init_commit:refs/heads/tea-pages"
          fi

          # 站点分支每次都是强推的单提交，refspec 前缀 + 让本地已有的引用也能被覆盖
          git fetch --no-tags --depth=2 "$PUSH_URL" +tea-pages:refs/remotes/origin/tea-pages
          git worktree add --detach pages refs/remotes/origin/tea-pages
          echo "📂 站点现有版本目录："
          find pages -maxdepth 1 -mindepth 1 -type d -name 'v*' -printf '  📁 %f\n' | sort -V || true

      - name: 🗂️ 写入站点目录
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "pages/${VERSION_PATH}"
          mkdir -p "pages/${VERSION_PATH}"
          cp -a build/web/. "pages/${VERSION_PATH}/"
          touch pages/.nojekyll
          echo "✅ 已写入 pages/${VERSION_PATH}"
          du -sh "pages/${VERSION_PATH}"

      - name: 🧹 清理过期版本（只留最近 3 个 MINOR）
        shell: bash
        run: |
          set -euo pipefail
          keep_minors=3
          mapfile -t versions_all < <(find pages -maxdepth 1 -mindepth 1 -type d -name 'v*' -printf '%f\n' | sort -V -r)
          declare -A minor_taken=()
          kept=()
          for v in "${versions_all[@]}"; do
            minor="${v#v}"
            minor="${minor%.*}"
            if [ -n "${minor_taken[$minor]:-}" ]; then
              echo "🗑️ 同一 MINOR 的旧版本：$v"
              continue
            fi
            if [ "${#minor_taken[@]}" -ge "$keep_minors" ]; then
              echo "🗑️ 超出最近 ${keep_minors} 个 MINOR：$v"
              continue
            fi
            minor_taken[$minor]="$v"
            kept+=("$v")
          done
          for v in "${versions_all[@]}"; do
            if [[ " ${kept[*]} " != *" $v "* ]]; then
              rm -rf "pages/$v"
            fi
          done
          # 本次刚发布的版本不能被清掉
          if [[ "$VERSION_PATH" == v* ]] && [ ! -d "pages/$VERSION_PATH" ]; then
            echo "❌ 本次发布的 $VERSION_PATH 被误删"
            exit 1
          fi
          echo "📁 保留版本：${kept[*]:-无}"
          du -sh pages

      - name: 🏠 生成版本索引页
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t versions < <(find pages -maxdepth 1 -mindepth 1 -type d -name 'v*' -printf '%f\n' | sort -V -r)
          has_debug=false
          if [ -d pages/debug ]; then has_debug=true; fi
          if [ "${#versions[@]}" -eq 0 ] && [ "$has_debug" != true ]; then
            echo "❌ 站点里既没有版本目录也没有 debug 目录"
            exit 1
          fi
          latest="${versions[0]:-}"
          app_title=$(grep '^description:' pubspec.yaml | sed -E 's/^description:[[:space:]]*//; s/[[:space:]]*-.*$//')
          now=$(date -u '+%Y-%m-%d %H:%M UTC')
          echo "📌 正式版本 ${#versions[@]} 个（最新 ${latest:-无}），debug 预览: ${has_debug}"

          : > /tmp/latest.html
          if [ -n "$latest" ]; then
            printf '    <a class="hero" href="./%s/">\n      <span class="hero-label">最新正式版本</span>\n      <span class="hero-ver">%s</span>\n      <span class="hero-go">▶ 立即开始游戏</span>\n    </a>\n' \
              "$latest" "$latest" >> /tmp/latest.html
          elif [ "$has_debug" = true ]; then
            printf '    <a class="hero" href="./debug/">\n      <span class="hero-label">暂无正式版本 · 先玩调试版</span>\n      <span class="hero-ver">debug</span>\n      <span class="hero-go">▶ 立即开始游戏</span>\n    </a>\n' \
              >> /tmp/latest.html
          fi

          : > /tmp/release-items.html
          for i in "${!versions[@]}"; do
            v="${versions[$i]}"
            badge=""
            if [ "$i" -eq 0 ]; then badge='<span class="badge">最新</span>'; fi
            printf '        <a class="card" href="./%s/"><span class="ver">%s%s</span><span class="go">进入试玩 →</span></a>\n' \
              "$v" "$v" "$badge" >> /tmp/release-items.html
          done
          if [ "${#versions[@]}" -eq 0 ]; then
            printf '        <p class="empty">暂无正式版本</p>\n' >> /tmp/release-items.html
          fi

          : > /tmp/debug-items.html
          if [ "$has_debug" = true ]; then
            printf '        <a class="card" href="./debug/"><span class="ver">debug<span class="badge badge-debug">预览</span></span><span class="go">最新一次构建 →</span></a>\n' \
              >> /tmp/debug-items.html
          else
            printf '        <p class="empty">暂无调试版本</p>\n' >> /tmp/debug-items.html
          fi

          awk -v title="$app_title" -v repo="${{ github.event.repository.name }}" -v updated="$now" \
              -v latest="/tmp/latest.html" -v releases="/tmp/release-items.html" -v debugf="/tmp/debug-items.html" '
            /__LATEST__/ {
              while ((getline line < latest) > 0) print line;
              close(latest);
              next
            }
            /__RELEASES__/ {
              while ((getline line < releases) > 0) print line;
              close(releases);
              next
            }
            /__DEBUG__/ {
              while ((getline line < debugf) > 0) print line;
              close(debugf);
              next
            }
            { gsub(/__TITLE__/, title); gsub(/__REPO__/, repo); gsub(/__UPDATED__/, updated); print }
          ' .github/pages/index.template.html > pages/index.html

          : > /tmp/versions.jsonl
          if [ "$has_debug" = true ]; then
            printf '{"version":"debug","url":"./debug/","latest":false,"debug":true}\n' >> /tmp/versions.jsonl
          fi
          for i in "${!versions[@]}"; do
            v="${versions[$i]}"
            is_latest=false
            if [ "$i" -eq 0 ]; then is_latest=true; fi
            jq -cn --arg v "$v" --argjson latest "$is_latest" \
              '{version: $v, url: ("./" + $v + "/"), latest: $latest, debug: false}' >> /tmp/versions.jsonl
          done
          jq -s . /tmp/versions.jsonl > pages/versions.json

          echo "--- 📄 versions.json ---"
          cat pages/versions.json

      - name: 🚀 提交并推送站点（历史压缩为单次提交）
        shell: bash
        run: |
          set -euo pipefail
          cd pages
          git add -A
          # 内容没变、且远端历史已经是单次提交时才跳过
          if git diff --cached --quiet && [ "$(git rev-list --count HEAD)" -eq 1 ]; then
            echo "ℹ️ 站点内容无变化，跳过提交"
            exit 0
          fi
          if [ "$IS_RELEASE" = true ]; then
            msg="🌐 发布 Web 版本 ${VERSION_PATH}"
          else
            msg="🧪 更新 Web 预览站点 ${VERSION_PATH}"
          fi
          # 每次发布都用当前索引生成一个无父提交并强推：tea-pages 永远只有一次提交，
          # 不再累积历次构建产物，clone / fetch 会快很多。
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -m "$msg")
          git push --force "$PUSH_URL" "$commit:refs/heads/tea-pages"
          echo "✅ 已推送到 tea-pages（单次提交，历史已压缩）"
          echo "🔗 ${{ github.server_url }}/${{ github.repository }}/src/branch/tea-pages/${VERSION_PATH}/"

  release:
    needs: [ metadata, build-android, build-windows, build-web ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    name: 🚀 创建 Gitea Release
    permissions:
      contents: write
    environment: release
    steps:
      - name: 📥 检出代码（用于生成更新日志）
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: ⬇️ 下载 Android 产物
        uses: actions/gitea-download-artifact@v8
        with:
          name: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-android-aarch64.apk
          path: artifacts

      - name: ⬇️ 下载 Windows 产物
        uses: actions/gitea-download-artifact@v8
        with:
          name: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-windows-x86_64.zip
          path: artifacts

      - name: ⬇️ 下载 Web 产物
        uses: actions/gitea-download-artifact@v8
        with:
          name: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-web.zip
          path: artifacts

      - name: 📝 生成发布说明
        id: notes
        run: |
          current_tag=${GITHUB_REF#refs/tags/}
          prev_tag=$(git tag --sort=-version:refname | grep -v "^$current_tag$" | head -1)
          if [[ -n "$prev_tag" ]]; then
            git log --pretty=format:"* %s (%h)" "$prev_tag".."$current_tag" -- . ":(exclude)docs" ":(exclude).github" ":(exclude).gitea" > /tmp/release_body.txt
          else
            echo "首次发布。" > /tmp/release_body.txt
          fi
          echo "=== 📝 发布说明 ==="
          cat /tmp/release_body.txt

      - name: 🚀 创建 Gitea Release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          PRERELEASE=false
          if echo "${{ github.ref_name }}" | grep -qE -- '-(rc|beta)'; then
            PRERELEASE=true
          fi

          BODY_JSON=$(jq -Rs . < /tmp/release_body.txt)
          response=$(curl -s -X POST \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases" \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${{ github.ref_name }}\",\"name\":\"${{ github.ref_name }}\",\"body\":${BODY_JSON},\"draft\":false,\"prerelease\":${PRERELEASE}}")

          release_id=$(echo "$response" | jq .id)

          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "❌ 创建 Release 失败: $response"
            exit 1
          fi

          echo "✅ 已创建 Release，ID: $release_id"

          for file in artifacts/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              echo "⬆️ 正在上传 $filename ..."
              curl -s -X POST \
                "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/$release_id/assets?name=$filename" \
                -H "Authorization: token $GITEA_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@$file"
            fi
          done
